<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Το ταξίδι μας 💕</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  background: black;
}

.story {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* Slides */
.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.slide.active {
  opacity: 1;
}

/* Overlay */
.overlay {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 25px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
}

.caption {
  font-size: 20px;
  color: white;
  animation: fadeUp 0.8s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Progress */
.progress {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 5px;
}

.bar {
  flex: 1;
  height: 3px;
  background: rgba(255,255,255,0.3);
}

.bar.active {
  background: #ff69b4;
}

/* Music button */
.music-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: rgba(255,105,180,0.7);
  border: none;
  padding: 10px;
  border-radius: 50%;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="story" id="story">

  <div class="progress" id="progress"></div>

  <!-- Slides -->
  <div class="slide active" style="background-image:url('https://picsum.photos/400/800?random=1')">
    <div class="overlay">
      <div class="caption">Και κάπως έτσι ξεκίνησε το ταξιδάκι μας 💕</div>
    </div>
  </div>

  <div class="slide" style="background-image:url('https://picsum.photos/400/800?random=2')">
    <div class="overlay">
      <div class="caption">Εσύ, εγώ… και λίγο χάσιμο 😏</div>
    </div>
  </div>

  <div class="slide" style="background-image:url('https://picsum.photos/400/800?random=3')">
    <div class="overlay">
      <div class="caption">Γέλια, βόλτες και κάτι ματιές 🥺</div>
    </div>
  </div>

  <div class="slide" style="background-image:url('https://picsum.photos/400/800?random=4')">
    <div class="overlay">
      <div class="caption">Και κάπου εκεί κατάλαβα… 😘</div>
    </div>
  </div>

  <div class="slide" style="background-image:url('https://picsum.photos/400/800?random=5')">
    <div class="overlay">
      <div class="caption">Ότι το καλύτερο κομμάτι ήσουν εσύ ❤️</div>
    </div>
  </div>

  <button class="music-btn" onclick="toggleMusic(event)">🎵</button>

</div>

<audio id="bgMusic" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
let current = 0;
let musicStarted = false;

const slides = document.querySelectorAll('.slide');
const barsContainer = document.getElementById('progress');
const music = document.getElementById('bgMusic');
const story = document.getElementById('story');

// progress bars
slides.forEach(() => {
  const bar = document.createElement('div');
  bar.className = 'bar';
  barsContainer.appendChild(bar);
});
const bars = document.querySelectorAll('.bar');

function showSlide(index) {
  slides.forEach(s => s.classList.remove('active'));
  bars.forEach(b => b.classList.remove('active'));

  slides[index].classList.add('active');
  bars[index].classList.add('active');
}

// tap navigation (left/right)
story.addEventListener('click', (e) => {

  // start music on first interaction
  if (!musicStarted) {
    music.play().catch(()=>{});
    musicStarted = true;
  }

  const x = e.clientX;

  if (x < window.innerWidth / 2) {
    // previous
    current = Math.max(0, current - 1);
  } else {
    // next
    current = Math.min(slides.length - 1, current + 1);
  }

  showSlide(current);
});

// music toggle
function toggleMusic(e) {
  e.stopPropagation();

  if (music.paused) {
    music.play();
  } else {
    music.pause();
  }
}
</script>

</body>
</html>
