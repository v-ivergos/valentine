<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Crimson Text', 'Georgia', serif;
            background: linear-gradient(135deg, #faf6f0 0%, #f5ede4 50%, #f0e5dc 100%);
            min-height: 100vh;
            color: #3d3d3d;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(218, 165, 100, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(184, 134, 85, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #2a2a2a;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-family: 'Playfair Display', serif;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #8b7355;
            font-style: italic;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .heart-divider {
            font-size: 2rem;
            margin: 20px 0;
            color: #d4a574;
            animation: heartbeat 1.5s ease-in-out infinite;
            animation-delay: 0.5s;
        }

        /* Gallery - Optimized for 5-6 images */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeInUp 0.8s ease-out backwards;
        }

        .gallery-item:nth-child(1) { animation-delay: 0.1s; }
        .gallery-item:nth-child(2) { animation-delay: 0.2s; }
        .gallery-item:nth-child(3) { animation-delay: 0.3s; }
        .gallery-item:nth-child(4) { animation-delay: 0.4s; }
        .gallery-item:nth-child(5) { animation-delay: 0.5s; }
        .gallery-item:nth-child(6) { animation-delay: 0.6s; }

        .gallery-item:hover {
            transform: scale(1.06);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.18);
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover .gallery-img {
            transform: scale(1.1);
        }

        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(218, 165, 100, 0) 0%, rgba(139, 115, 85, 0.4) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .overlay-icon {
            font-size: 3.5rem;
            color: white;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            animation: zoomIn 0.3s ease;
        }

        .modal-img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 25px 100px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: -50px;
            right: 0;
            font-size: 2.5rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 300;
        }

        .close-btn:hover {
            transform: scale(1.2);
            color: #d4a574;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            color: white;
            cursor: pointer;
            padding: 15px 25px;
            transition: all 0.3s ease;
            user-select: none;
        }

        .nav-btn:hover {
            color: #d4a574;
            transform: translateY(-50%) scale(1.2);
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        /* Image counter */
        .image-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #8b7355;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 {
                font-size: 3.5rem;
            }

            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 25px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
            }

            .modal-img {
                max-height: 70vh;
            }

            .nav-btn {
                font-size: 2rem;
                padding: 12px 20px;
            }

            .close-btn {
                top: -40px;
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 15px;
            }

            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .heart-divider {
                font-size: 1.5rem;
            }

            .nav-btn {
                font-size: 1.5rem;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Our First Journey</h1>
            <div class="heart-divider">♥</div>
            <p class="subtitle">Moments together</p>
        </header>

        <div class="gallery">
            <div class="gallery-item" onclick="openModal(0)">
                <img src="images/IMG_20260419_104632.jpg" alt="Memory 1" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>

            <div class="gallery-item" onclick="openModal(1)">
                <img src="images/IMG_20260418_144255.jpg" alt="Memory 2" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>

            <div class="gallery-item" onclick="openModal(2)">
                <img src="images/IMG_20260418_145046.jpg" alt="Memory 3" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>

            <div class="gallery-item" onclick="openModal(3)">
                <img src="images/IMG_20260418_143830.jpg" alt="Memory 4" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>

            <div class="gallery-item" onclick="openModal(4)">
                <img src="images/IMG_20260418_144228.jpg" alt="Memory 5" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>

            <div class="gallery-item" onclick="openModal(5)">
                <img src="images/IMG_20260418_144318.jpg" alt="Memory 6" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>
			<div class="gallery-item" onclick="openModal(6)">
                <img src="images/IMG_20260418_144145.jpg" alt="Memory 7" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>
			<div class="gallery-item" onclick="openModal(7)">
                <img src="images/IMG_20260418_145011.jpg" alt="Memory 8" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>	
			<div class="gallery-item" onclick="openModal(8)">
                <img src="images/IMG_20260421_121927.jpg" alt="Memory 9" class="gallery-img">
                <div class="gallery-overlay"><span class="overlay-icon">🔍</span></div>
            </div>				
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <span class="nav-btn prev" onclick="changeImage(-1)">‹</span>
            <img class="modal-img" id="modalImg" src="" alt="Full view">
            <span class="nav-btn next" onclick="changeImage(1)">›</span>
            <div class="image-counter">
                <span id="currentImage">1</span> / <span id="totalImages">6</span>
            </div>
        </div>
    </div>

    <footer>
        <p>♥</p>
    </footer>

    <script>
        const images = [
            'images/IMG_20260418_143830.jpg',
            'images/IMG_20260418_144145.jpg',
            'images/IMG_20260418_144228.jpg',
            'images/IMG_20260418_144255.jpg',
            'images/IMG_20260418_144318.jpg',
            'images/IMG_20260418_145011.jpg',
			'images/IMG_20260418_145046.jpg',
			'images/IMG_20260419_104632.jpg',
			'images/IMG_20260421_121927.jpg',
        ];

        let currentImageIndex = 0;

        function openModal(index) {
            currentImageIndex = index;
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modalImg');
            const currentImage = document.getElementById('currentImage');
            
            modalImg.src = images[index];
            currentImage.textContent = index + 1;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function changeImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex >= images.length) {
                currentImageIndex = 0;
            } else if (currentImageIndex < 0) {
                currentImageIndex = images.length - 1;
            }
            
            const modalImg = document.getElementById('modalImg');
            const currentImage = document.getElementById('currentImage');
            
            modalImg.src = images[currentImageIndex];
            currentImage.textContent = currentImageIndex + 1;
        }

        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeModal();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('modal');
            if (modal.classList.contains('active')) {
                if (event.key === 'ArrowLeft') changeImage(-1);
                if (event.key === 'ArrowRight') changeImage(1);
                if (event.key === 'Escape') closeModal();
            }
        });

        // Update total images count on page load
        document.getElementById('totalImages').textContent = images.length;
    </script>
</body>
</html>
